<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>트레센 스파이어 V0.04</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<header class="topbar"><div><div class="eyebrow">UMA DECK PROTOTYPE V0.04</div><h1>트레센 스파이어</h1></div><div class="run-stats"><button id="dataBtn" class="tiny ghost">데이터 관리</button><span>캐릭터 <b id="charLabel">-</b></span><span>HP <b id="runHp">-</b></span><span>골드 <b id="gold">-</b></span><span>층 <b id="floorLabel">-</b></span></div></header>
<main>
<section id="selectScreen" class="screen active"><div class="panel select-panel"><div class="eyebrow">SELECT CHARACTER</div><h2>도전할 우마무스메를 선택하세요</h2><p class="muted">세 캐릭터는 시작 덱과 핵심 메커니즘이 완전히 다릅니다.</p><div id="characterGrid" class="character-grid"></div></div></section>
<section id="mapScreen" class="screen"><div class="panel map-panel"><h2>루트 선택</h2><p class="muted">연결된 다음 노드 하나를 선택하세요.</p><div id="map" class="map"></div></div><aside class="panel side-info"><h3 id="sideCharName">현재 덱</h3><div id="charMechanic" class="mechanic-box"></div><div class="relic-strip"><b>유물</b><div id="relicList" class="relic-list"></div></div><div id="deckSummary" class="deck-summary"></div><button id="viewDeckBtn" class="ghost">덱 보기</button></aside></section>
<section id="battleScreen" class="screen"><div class="battle-head panel"><div><div class="eyebrow">BATTLE</div><h2 id="enemyName">모의전 상대</h2></div><div class="enemy-intent" id="enemyIntent"></div></div>
<div class="combatants"><div class="combatant player-card panel"><div id="playerPortrait" class="portrait placeholder">?</div><h3 id="playerName">-</h3><div class="hpbar"><span id="playerHpBar"></span></div><div class="statline"><span id="playerHpText"></span><span>방어 <b id="playerBlock">0</b></span></div><div id="specialMeter" class="special-meter"></div><div id="playerStatus" class="status-row"></div></div><div class="vs">VS</div><div class="combatant enemy-card panel"><div class="portrait enemy-placeholder">!</div><h3 id="enemyNameCard"></h3><div class="hpbar enemy"><span id="enemyHpBar"></span></div><div class="statline"><span id="enemyHpText"></span><span>방어 <b id="enemyBlock">0</b></span></div><div id="enemyStatus" class="status-row"></div></div></div>
<div class="battle-log panel" id="battleLog"></div><div class="hand-wrap"><div class="energy-orb">행동력 <b id="energy">3</b>/3</div><div id="hand" class="hand"></div><button id="endTurnBtn" class="end-turn">턴 종료</button></div></section>
<section id="rewardScreen" class="screen"><div class="panel reward-panel"><div class="eyebrow">REWARD</div><h2>전투 승리</h2><p>카드를 하나 선택해 덱에 추가하세요.</p><div id="rewardCards" class="reward-cards"></div><button id="skipRewardBtn" class="ghost">보상 건너뛰기</button></div></section>
<section id="restScreen" class="screen"><div class="panel reward-panel"><div class="eyebrow">REST</div><h2>휴식</h2><p id="restText"></p><button id="restContinueBtn">계속</button></div></section>
<section id="eventScreen" class="screen"><div class="panel reward-panel"><div class="eyebrow">EVENT</div><h2 id="eventTitle">이벤트</h2><p id="eventBody"></p><div id="eventActions" class="event-actions"></div></div></section>
<section id="gameOverScreen" class="screen"><div class="panel reward-panel"><h2 id="gameOverTitle"></h2><p id="gameOverText"></p><button id="restartBtn">캐릭터 선택으로</button></div></section>
</main></div>
<dialog id="deckDialog"><div class="dialog-head"><h3>현재 덱</h3><button id="closeDeckBtn">×</button></div><div id="deckList" class="deck-list"></div></dialog>
<dialog id="dataDialog" class="data-dialog"><div class="dialog-head"><div><div class="eyebrow">CONTENT LAB</div><h3>데이터 관리</h3></div><button id="closeDataBtn">×</button></div>
<div class="data-tabs"><button data-tab="cards" class="active">카드</button><button data-tab="events">이벤트</button><button data-tab="enemies">적</button><button data-tab="relics">유물</button><button data-tab="json">JSON</button></div>
<div id="dataPanel"></div></dialog>
<script src="game.js"></script></body></html>
